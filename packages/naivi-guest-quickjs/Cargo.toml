[package]
name = "naivi-guest-quickjs"
description = "naivi (Vue Vapor AOT) native guest: embeds QuickJS (rquickjs) to run guest JS bundles against the naivi-dom ops core"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# naivi bridge core (U3 + U5 FFI)
naivi-dom = { path = "../naivi-dom", features = ["quickjs"] }

# QuickJS (QuickJS-NG) via rquickjs
rquickjs = { workspace = true }

# Logging
tracing = { workspace = true }
