[package]
name = "naivi-native"
description = "naivi (Vue Vapor) generic native host — winit entry embedding the QuickJS guest (U5); runs ANY demo's page bundle"
version = "0.0.0"
edition = "2024"
publish = false

[[bin]]
name = "naivi-native"
path = "src/main.rs"

[dependencies]
# naivi bridge core (U3) + native FFI (U5)
naivi-dom = { path = "../naivi-dom", features = ["quickjs"] }
naivi-guest-quickjs = { path = "../naivi-guest-quickjs" }

# blitz engine + shell + renderer
anyrender_vello_hybrid = { workspace = true }
blitz-dom = { workspace = true, features = ["system-fonts"] }
blitz-shell = { workspace = true, default-features = false, features = ["tracing"] }
blitz-traits = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# JS-string encoding for the injected __NAIVE_CSS global (U6)
serde_json = { workspace = true }
