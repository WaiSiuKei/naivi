<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>naivi — blitz wasm</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <link data-trunk rel="copy-dir" href="assets" />
    <style>
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        /* Host-page contract (plan 056): full-viewport #app container. */
      }
      #app { height: 100%; }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="blitz-target"></canvas>
    </div>
    <!-- Guest bundle: emitted by `nv wasm --release` (run in any
         examples/naivi/<demo>). Trunk copies assets/ verbatim into dist,
         so ./assets/guest/guest.js resolves. -->
    <script type="module" src="./assets/guest/guest.js"></script>
  </body>
</html>
